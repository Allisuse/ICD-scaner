<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ICD Scanner</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; font-family: sans-serif; }
        #camera-view { width: 100%; height: 100%; object-fit: cover; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .guide-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 70%; height: 60%;
            border: 3px solid #ff3b30; border-radius: 10px;
            box-sizing: border-box;
        }
        .guide-line {
            position: absolute; top: 50%; left: 0; width: 100%;
            border-top: 2px dashed #ff3b30;
        }
        #capture-btn {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            padding: 15px 40px; font-size: 18px; font-weight: bold;
            background-color: white; color: black;
            border: none; border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer;
        }
        #capture-btn:active { background-color: #ddd; }
    </style>
</head>
<body>

    <!-- จุดที่แก้ไขที่ 1: เพิ่มคำว่า muted เข้าไป -->
    <video id="camera-view" autoplay playsinline muted></video>

    <div class="overlay">
        <div class="guide-box">
            <div class="guide-line"></div>
        </div>
    </div>

    <button id="capture-btn">📷 ถ่ายภาพเพื่อคำนวณ</button>

    <script>
        const video = document.getElementById('camera-view');
        const captureBtn = document.getElementById('capture-btn');

        // จุดที่แก้ไขที่ 2: ปรับ facingMode ให้รองรับมือถือหลายรุ่นขึ้น
        navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } } })
            .then(function(stream) {
                video.srcObject = stream;
                
                // จุดที่แก้ไขที่ 3: บังคับให้เล่นวิดีโอเมื่อโหลดสตรีมเสร็จ
                video.onloadedmetadata = function(e) {
                    video.play();
                };
            })
            .catch(function(error) {
                console.error("เกิดข้อผิดพลาดในการเข้าถึงกล้อง: ", error);
                alert("ระบบไม่สามารถเปิดกล้องได้ กรุณาตรวจสอบการอนุญาตในตั้งค่าของเบราว์เซอร์");
            });

        captureBtn.addEventListener('click', function() {
            alert("บันทึกภาพสำเร็จ! (จำลองการกดถ่าย)");
        });
    </script>
</body>
</html>
